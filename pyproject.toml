[project]
name = "atlas"
version = "0.1.0"
description = "Production-grade multi-tenant LLM serving behavior on constrained hardware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Phase 1–2: naive HF load + fundamentals sims + charts
    "transformers>=4.40",
    "accelerate>=0.30",
    "psutil>=5.9",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "torch>=2.6.0",
    "nvidia-ml-py>=12.0",
    "safetensors>=0.4",
    # Phase 4–5.5: gateway / router / observability / clients (laptop-first)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "openai>=1.30",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
    "asyncpg>=0.29",
]

[dependency-groups]
# Local lint/test later
dev = [
    "pytest>=9.1.1",
]
# Colab / Kaggle / WSL GPU runtimes (Phase 3+). Prefer matching the runtime CUDA docs.
# vLLM has limited native Windows support — install this group on Linux/Colab/WSL.
gpu = [
    "vllm",
    "bitsandbytes>=0.43",
]

[tool.uv]
package = false
default-groups = ["dev"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"
