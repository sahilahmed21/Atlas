name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Gateway/worker/benchmark tests only. The default pyproject deps include torch (cu124
      # index) for Phase 1-3 experiments, which CI does not need.
      - name: Install test dependencies
        run: >
          python -m pip install
          "fastapi>=0.110" "uvicorn>=0.27" "pydantic>=2.6" "httpx>=0.27"
          "prometheus-client>=0.20" "pyyaml>=6.0" "pytest>=8"
          "opentelemetry-api>=1.24" "opentelemetry-sdk>=1.24"
      - name: Test
        run: python -m pytest platform workers benchmarks evals -q
