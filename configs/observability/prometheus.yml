# Scrapes Atlas gateway + workers when they expose /metrics on the host.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: atlas-gateway
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: gateway

  - job_name: atlas-worker-a
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          service: worker
          replica: a

  - job_name: atlas-worker-b
    static_configs:
      - targets: ["host.docker.internal:8002"]
        labels:
          service: worker
          replica: b
